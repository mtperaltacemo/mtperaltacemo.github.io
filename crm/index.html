<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CRM Línea Amarilla y Agrícolas</title>
<link rel="icon" href="icono.png"><link rel="apple-touch-icon" href="icono.png"><link rel="manifest" href="manifest.json">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script>
<style>
:root{--bg:#f4f1ea;--pn:#fff;--pn2:#f0ece1;--fg:#1d2417;--mu:#667060;--bd:#d9d3c3;--am:#f5b800;--ag:#2e9d4f;--rd:#dc2626;--yl:#d99a00;--gr:#16a34a;--ac:#2e6b3a;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12150f;--pn:#1b2016;--pn2:#242b1e;--fg:#f1f3e8;--mu:#a3ad99;--bd:#343d2b;--ac:#7bd88f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12150f;--pn:#1b2016;--pn2:#242b1e;--fg:#f1f3e8;--mu:#a3ad99;--bd:#343d2b;--ac:#7bd88f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 Inter,system-ui,Segoe UI,sans-serif;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px}
h1{font:700 20px Space Grotesk,Inter,sans-serif;margin:0}
h2{font:700 16px Space Grotesk,Inter,sans-serif;margin:14px 0 6px}
.hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.hd small{color:var(--mu)}
.logo{display:inline-block;width:14px;height:14px;border-radius:4px;background:linear-gradient(90deg,var(--am) 50%,var(--ag) 50%);margin-right:6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tab{border:1px solid var(--bd);background:var(--pn);color:var(--fg);padding:8px 13px;border-radius:9px;cursor:pointer;font:600 13px inherit}
.tab.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:12px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:10px}
.kpi{background:var(--pn);border:1px solid var(--bd);border-left:5px solid var(--ac);border-radius:10px;padding:8px 10px}
.kpi b{display:block;font-size:11px;color:var(--mu);font-weight:600}
.kpi span{font:700 20px Space Grotesk,sans-serif}
.kpi.am{border-left-color:var(--am)}.kpi.rd{border-left-color:var(--rd)}.kpi.ag{border-left-color:var(--ag)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
input,select,textarea{background:var(--pn2);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;font:inherit;min-width:0;max-width:100%}
textarea{width:100%;min-height:64px}
button{background:var(--ac);color:var(--bg);border:0;border-radius:8px;padding:7px 12px;font:600 13px inherit;cursor:pointer}
button.g{background:var(--pn2);color:var(--fg);border:1px solid var(--bd)}
button.d{background:var(--rd);color:#fff}
button.sm{padding:3px 8px;font-size:12px}
.tw{overflow:auto;max-width:100%;border:1px solid var(--bd);border-radius:10px;background:var(--pn)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--pn2);text-align:left;padding:7px 8px;white-space:nowrap;position:sticky;top:0}
td{padding:6px 8px;border-top:1px solid var(--bd);vertical-align:top}
tr.cl{cursor:pointer}tr.cl:hover td{background:var(--pn2)}
.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:700;margin-right:3px;white-space:nowrap}
.cA{background:var(--am);color:#2b2200}.cG{background:var(--ag);color:#fff}
.sr{background:var(--rd);color:#fff}.sy{background:var(--yl);color:#fff}.sg{background:var(--gr);color:#fff}
.mu{color:var(--mu)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px;margin:14px 0 22px}
.bars div{flex:1;background:var(--ac);border-radius:4px 4px 0 0;position:relative;min-height:2px}
.bars div i{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font:10px Inter;font-style:normal;color:var(--mu);white-space:nowrap}
.bars div u{position:absolute;top:100%;left:50%;transform:translateX(-50%);font:10px Inter;text-decoration:none;color:var(--mu)}
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:10px;overflow:auto;padding-bottom:6px}
.col{background:var(--pn2);border-radius:10px;padding:8px;min-height:140px}
.col h3{margin:0 0 6px;font-size:13px}
.op{background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:8px;margin-bottom:6px;cursor:pointer}
.ov{position:fixed;inset:0;background:#0007;z-index:50;overflow:auto;padding:12px}
.md{background:var(--pn);border-radius:14px;max-width:860px;margin:0 auto;padding:14px;border:1px solid var(--bd)}
.fl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.fl label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mu);font-weight:600}
.fl label.w{grid-column:1/-1}
.tl{border-left:3px solid var(--ac);padding-left:10px;margin:8px 0}
.tl img{max-width:160px;border-radius:8px;margin-top:4px;display:block}
.warn{background:var(--yl);color:#fff;padding:6px 10px;border-radius:8px;margin:6px 0;font-size:12px}
.note{color:var(--mu);font-size:12px}
</style></head><body>
<div class="hd"><h1><span class="logo"></span>CRM · Línea Amarilla y Agrícolas</h1><small id="who"></small><button class="g sm" id="out" hidden>Cerrar sesión</button></div>
<div id="warn"></div>
<div class="tabs" id="tabs"></div>
<div id="app"><div class="note">Cargando…</div></div>
<div id="ov" class="ov" hidden></div>
<script>
const claude={use:async n=>n==='downloads'?{save:async({filename,data})=>{const b=new Blob([data],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();a.remove()}}:null};
const TABS=[['panel','Panel'],['cli','Clientes'],['vis','Visitas y agenda'],['opp','Oportunidades'],['plan','Plan de visitas'],['mant','Equipos y mantenimiento'],['rep','Reportes']];
const TIPOS=['Visita presencial','Llamada','WhatsApp','Visita técnica','Entrega / cobranza'];
const RES=['Muy positivo','Positivo','Neutro','Sin contacto','Negativo'];
const ETAPAS=['Prospecto','Contacto','Cotización','Negociación','Ganada','Perdida'];
const ESTADOS=['Activo','En seguimiento','En riesgo','Inactivo','Prospecto'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf=x=>Number(x||0).toLocaleString('en-US',{maximumFractionDigits:0});
const today=()=>new Date().toISOString().slice(0,10);
const days=d=>d?Math.floor((Date.now()-new Date(d+'T12:00:00').getTime())/864e5):null;
const addDays=(n)=>new Date(Date.now()+n*864e5).toISOString().slice(0,10);
let DB=null,UID='local',UOWNER=false,CL=[],VEND=[],ST={},VIS={},OPP={},EQ={},MAT=[],USERS={},ME=null,view='panel',F={seg:'',rg:'',vid:'',est:'',sem:'',q:'',sort:'score'};
const mem={cli:{},vis:{},opp:{},users:{}};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
// ---------- persistencia
async function put(col,id,data,merge){
 const store={cli:ST,vis:VIS,opp:OPP,users:USERS,eq:EQ}[col];
 store[id]=merge?{...(store[id]||{}),...data}:data;render();
 if(!DB){return}
 try{const r=DB.collection('crm_'+col).doc(id);await(merge?r.set({...(store[id])}):r.set(data))}catch(e){warn('No se pudo guardar: '+(e.message||e.code||e))}}
async function del(col,id){const store={cli:ST,vis:VIS,opp:OPP,eq:EQ}[col];delete store[id];render();if(DB)try{await DB.collection('crm_'+col).doc(id).delete()}catch(e){warn('No se pudo borrar: '+(e.message||e.code))}}
function warn(t){$('#warn').innerHTML=t?'<div class="warn">'+esc(t)+'</div>':''}
function sub(col,store){DB.collection('crm_'+col).onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());Object.keys(store).forEach(k=>delete store[k]);Object.assign(store,o);render()},e=>warn('Error de datos compartidos: '+(e.message||e.code)))}
// ---------- clientes y prioridad
const ov=c=>{const t=ST[c.id];return t&&t.respVid?{...c,vid:t.respVid,vend:t.respName||c.vend}:c};
const cli=id=>{const c=CL.find(c=>c.id===id)||(ST[id]&&ST[id].manual?manualCli(id):null);return c?ov(c):null};
function manualCli(id){const s=ST[id];return{id,n:s.n,nit:s.nit||'',s:s.seg||'A',vend:s.vendName||'',vid:s.vid||'',ce:'',rg:s.rg||'OTRO',va:[0,0,0,0,0,0],vg:[0,0,0,0,0,0],la:'',lg:'',nt:0,top:[],mk:[],manual:true}}
const all=()=>CL.concat(Object.keys(ST).filter(k=>ST[k].manual).map(manualCli)).map(ov);
const vtot=c=>c.va.map((x,i)=>x+c.vg[i]);
const lastBuy=c=>[c.la,c.lg].filter(Boolean).sort().pop()||'';
function lastVisit(id){let m='';Object.values(VIS).forEach(v=>{if(v.cid===id&&v.estado!=='plan'&&v.fecha>m)m=v.fecha});return m}
function est(c){return(ST[c.id]&&ST[c.id].estado)||(c.manual?'Prospecto':'Activo')}
function score(c){const t=vtot(c);const v24=t[3]+t[4]+t[5];let s=Math.min(40,Math.log10(v24+1)*8);const lb=lastBuy(c),db=days(lb),lv=lastVisit(c.id),dv=days(lv);const why=[];
 if(lb==='')s+=5;else if(db>180){s+=25;why.push('Sin compra hace '+db+' d')}else if(db>90){s+=15;why.push('Sin compra hace '+db+' d')}else if(db>45)s+=5;
 if(t[4]>0&&t[5]<t[4]*0.5){s+=15;why.push('Caída vs 2025')}
 if(!lv){s+=20;why.push('Nunca visitado')}else if(dv>90){s+=20;why.push('Sin visita '+dv+' d')}else if(dv>60){s+=10;why.push('Sin visita '+dv+' d')}else if(dv>30)s+=4;
 if(est(c)==='En riesgo'){s+=10;why.push('Marcado en riesgo')}
 return{s:Math.round(s),why,db,dv,v24}}
const sem=s=>s>=60?['sr','Alta']:s>=40?['sy','Media']:['sg','Baja'];
const segChips=s=>(s.includes('A')?'<span class="chip cA">Línea Amarilla</span>':'')+(s.includes('G')?'<span class="chip cG">Agrícola</span>':'');
function mine(c){if(!ME||ME==='all')return true;if(ME.startsWith('seg:'))return c.s.includes(ME.slice(4));return c.vid===ME}
function mr(v){if(!ME||ME==='all')return true;if(ME.startsWith('seg:')){const c=cli(v.cid);return !!c&&c.s.includes(ME.slice(4))}return v.vid===ME}
// ---------- vistas
function render(){
 $('#tabs').innerHTML=TABS.map(t=>'<button class="tab'+(view===t[0]?' on':'')+'" data-v="'+t[0]+'">'+t[1]+'</button>').join('')+'<span style="flex:1"></span><select id="me" title="Soy el vendedor"><option value="all">Ver todo el equipo</option><option value="seg:A"'+(ME==='seg:A'?' selected':'')+'>Perfil: solo Línea Amarilla</option><option value="seg:G"'+(ME==='seg:G'?' selected':'')+'>Perfil: solo Agrícola</option>'+VEND.map(v=>'<option value="'+v[0]+'"'+(ME===v[0]?' selected':'')+'>'+esc(v[1])+' ('+v[2]+')</option>').join('')+'</select>';
 document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
 if(!UOWNER)$('#me').style.display='none';
 $('#me').onchange=e=>{ME=e.target.value;ls('crm_me',ME);render()};
 $('#who').textContent=(UOWNER?'Administrador · ':'')+(ME&&ME.startsWith('seg:')?'Perfil: '+(ME==='seg:A'?'Línea Amarilla':'Agrícola'):ME&&ME!=='all'?'Mis clientes: '+(VEND.find(v=>v[0]===ME)||[0,''])[1]:'Vista de todo el equipo');
 ({panel:vPanel,cli:vCli,vis:vVis,opp:vOpp,plan:vPlan,mant:vMant,rep:vRep,adm:vAdm}[view])();
}
function bars(vals,labs){const mx=Math.max(...vals,1);return '<div class="bars">'+vals.map((v,i)=>'<div style="height:'+Math.max(2,v/mx*100)+'%"><i>'+(v>=1000?nf(v/1000)+'k':nf(v))+'</i><u>'+labs[i]+'</u></div>').join('')+'</div>'}
function vPanel(){
 const cs=all().filter(mine),m0=today().slice(0,7);const vs=Object.entries(VIS).filter(([k,v])=>v.estado!=='plan'&&mr(v));
 const visM=vs.filter(([k,v])=>v.fecha.slice(0,7)===m0).length;
 const vis30=new Set(vs.filter(([k,v])=>days(v.fecha)<=30).map(([k,v])=>v.cid));
 const pend=Object.entries(VIS).filter(([k,v])=>v.prox&&!v.proxHecha&&v.prox<today()&&mr(v));
 const op=Object.values(OPP).filter(mr),ab=op.filter(o=>!['Ganada','Perdida'].includes(o.etapa));
 const gan=op.filter(o=>o.etapa==='Ganada'&&(o.cierre||'').slice(0,7)===m0);
 const sc=cs.map(c=>({c,x:score(c)})).sort((a,b)=>b.x.s-a.x.s);
 const wk=[];for(let i=7;i>=0;i--){const a=addDays(-7*i-6),b=addDays(-7*i);wk.push([b.slice(5),vs.filter(([k,v])=>v.fecha>=a&&v.fecha<=b).length])}
 $('#app').innerHTML='<div class="kpis"><div class="kpi am"><b>Clientes Línea Amarilla</b><span>'+cs.filter(c=>c.s.includes('A')).length+'</span></div><div class="kpi ag"><b>Clientes Agrícolas</b><span>'+cs.filter(c=>c.s.includes('G')).length+'</span></div><div class="kpi"><b>Visitados últimos 30 días</b><span>'+vis30.size+' ('+(cs.length?Math.round([...vis30].filter(id=>cs.some(c=>c.id===id)).length/cs.length*100):0)+'%)</span></div><div class="kpi"><b>Visitas este mes</b><span>'+visM+'</span></div><div class="kpi rd"><b>Acciones vencidas</b><span>'+pend.length+'</span></div><div class="kpi rd"><b>Mantenimientos vencidos</b><span>'+Object.values(EQ).filter(e=>{const c=cli(e.cid);const d=eqDue(e);return c&&mine(c)&&d[0]&&d[0].f<today()}).length+'</span></div><div class="kpi"><b>Oportunidades abiertas</b><span>'+ab.length+' · Bs '+nf(ab.reduce((a,o)=>a+(+o.monto||0),0))+'</span></div><div class="kpi ag"><b>Ganadas este mes</b><span>Bs '+nf(gan.reduce((a,o)=>a+(+o.monto||0),0))+'</span></div></div>'
 +'<div class="grid2"><div class="card"><h2 style="margin-top:0">Visitas por semana</h2>'+bars(wk.map(w=>w[1]),wk.map(w=>w[0]))+'</div><div class="card"><h2 style="margin-top:0">Embudo</h2>'+ETAPAS.map(e=>{const l=op.filter(o=>o.etapa===e);return '<div class="row" style="margin:3px 0"><b style="width:100px">'+e+'</b><span>'+l.length+' · Bs '+nf(l.reduce((a,o)=>a+(+o.monto||0),0))+'</span></div>'}).join('')+'</div></div>'
 +'<h2>A visitar primero</h2>'+tblCli(sc.slice(0,12))+'<div class="note">Prioridad = valor de compras 2024–2026 + días sin comprar + caída vs 2025 + días sin visita. Las ventas cargadas llegan al 30-sep-2026.</div>';
 bindRows()}
function tblCli(rows){return '<div class="tw"><table><thead><tr><th>Cliente</th><th>Segmento</th><th>Responsable</th><th class="n">Compras 24–26 Bs</th><th>Últ. compra</th><th>Últ. visita</th><th>Prioridad</th><th>Motivo</th></tr></thead><tbody>'+rows.map(({c,x})=>{const s=sem(x.s);return '<tr class="cl" data-id="'+esc(c.id)+'"><td><b>'+esc(c.n)+'</b><br><span class="mu">'+esc(c.id)+' · '+esc(c.rg)+'</span></td><td>'+segChips(c.s)+'</td><td>'+esc(c.vend)+'</td><td class="n">'+nf(x.v24)+'</td><td>'+(lastBuy(c)||'—')+'</td><td>'+(lastVisit(c.id)||'—')+'</td><td><span class="chip '+s[0]+'">'+s[1]+' '+x.s+'</span></td><td class="mu">'+esc(x.why.join(' · '))+'</td></tr>'}).join('')+'</tbody></table></div>'}
function bindRows(){document.querySelectorAll('tr.cl').forEach(r=>r.onclick=()=>ficha(r.dataset.id))}
function vCli(){
 const rgs=[...new Set(all().map(c=>c.rg))].sort();
 $('#app').innerHTML='<div class="row"><input id="q" placeholder="Buscar cliente, ID o NIT…" value="'+esc(F.q)+'" style="flex:1;min-width:180px"><select id="fs"><option value="">Todos los segmentos</option><option value="A">Línea Amarilla</option><option value="G">Agrícola</option></select><select id="fr"><option value="">Todas las regionales</option>'+rgs.map(r=>'<option>'+r+'</option>').join('')+'</select><select id="fv"><option value="">Todos los vendedores</option>'+VEND.map(v=>'<option value="'+v[0]+'">'+esc(v[1])+'</option>').join('')+'</select><select id="fe"><option value="">Todo estado</option>'+ESTADOS.map(r=>'<option>'+r+'</option>').join('')+'</select><select id="fm"><option value="">Toda prioridad</option><option value="sr">Alta</option><option value="sy">Media</option><option value="sg">Baja</option></select><select id="fo"><option value="score">Orden: prioridad</option><option value="v24">Orden: compras 24–26</option><option value="db">Orden: días sin comprar</option><option value="n">Orden: nombre</option></select><button id="nuevo">+ Prospecto</button></div><div id="lst"></div>';
 const set=(id,k)=>{const e=$(id);e.value=F[k];e.onchange=e.oninput=()=>{F[k]=e.value;LIM=150;list()}};set('#q','q');set('#fs','seg');set('#fr','rg');set('#fv','vid');set('#fe','est');set('#fm','sem');set('#fo','sort');
 $('#nuevo').onclick=()=>prospecto();
 list()}
let LIM=150;
function list(){
 let r=all().filter(c=>mine(c)||F.vid).map(c=>({c,x:score(c)}));
 const q=F.q.toLowerCase();
 r=r.filter(({c,x})=>(!q||(c.n+c.id+c.nit).toLowerCase().includes(q))&&(!F.seg||c.s.includes(F.seg))&&(!F.rg||c.rg===F.rg)&&(!F.vid||c.vid===F.vid)&&(!F.est||est(c)===F.est)&&(!F.sem||sem(x.s)[0]===F.sem));
 r.sort((a,b)=>F.sort==='n'?a.c.n.localeCompare(b.c.n):F.sort==='v24'?b.x.v24-a.x.v24:F.sort==='db'?(b.x.db??9999)-(a.x.db??9999):b.x.s-a.x.s);
 $('#lst').innerHTML='<div class="note" style="margin-bottom:4px">'+r.length+' clientes'+(r.length>LIM?' (se muestran '+LIM+')':'')+'</div>'+tblCli(r.slice(0,LIM))+(r.length>LIM?'<div class="row" style="justify-content:center;margin:10px 0"><button id="mas">Ver 150 más</button><button id="todos" class="sec">Ver todos ('+r.length+')</button></div>':'');
 const mb=$('#mas');if(mb)mb.onclick=()=>{LIM+=150;list()};const tb=$('#todos');if(tb)tb.onclick=()=>{LIM=r.length;list()};bindRows()}
// ---------- ficha
function ficha(id){const c=cli(id);if(!c)return;const s=ST[id]||{};const x=score(c);const t=vtot(c);
 const vis=Object.entries(VIS).filter(([k,v])=>v.cid===id).sort((a,b)=>b[1].fecha.localeCompare(a[1].fecha));
 const ops=Object.entries(OPP).filter(([k,o])=>o.cid===id);
 const ov=$('#ov');ov.hidden=false;
 ov.innerHTML='<div class="md"><div class="row" style="justify-content:space-between"><div><h1>'+esc(c.n)+'</h1><span class="mu">'+esc(c.id)+(c.nit?' · NIT '+esc(c.nit):'')+' · '+esc(c.rg)+' · '+esc(c.vend)+'</span><br>'+segChips(c.s)+'</div><button class="g" id="x">Cerrar</button></div>'

 +'<div class="card" style="margin-top:10px"><b>2. Perfiles de vendedores</b><div class="note">Primero crea el usuario (correo y clave) en Firebase → Authentication. Luego asigna aquí su perfil.</div><div class="tw"><table><thead><tr><th>Correo</th><th>Perfil</th><th></th></tr></thead><tbody id="pr">'+Object.entries(map).map(([e,p])=>'<tr><td>'+esc(e)+'</td><td>'+esc(PERF_LABEL[p]||p)+'</td><td><button class="d sm" data-x="'+esc(e)+'">Quitar</button></td></tr>').join('')+'</tbody></table></div><div class="row"><input id="pe" type="email" placeholder="correo del vendedor" style="flex:1;min-width:200px"><select id="pp"><option value="A">Solo Línea Amarilla</option><option value="G">Solo Agrícola</option><option value="all">Todo</option></select><button id="pa">Agregar</button></div></div>';
 $('#app').insertAdjacentHTML('beforeend','<div class="card" style="margin-top:10px"><b>3. Respaldo</b><div class="note">Descarga una copia de todas las visitas, oportunidades, equipos y datos de clientes registrados. Se recomienda hacerlo una vez al mes y guardarlo en un lugar seguro.</div><div class="row"><button id="bk">Descargar respaldo</button></div><div id="bkm" class="note"></div></div>');
 $('#bk').onclick=async()=>{const m=$('#bkm');try{m.textContent='Preparando…';const o={fecha:new Date().toISOString(),version:1},n={};for(const c of ['cli','vis','opp','eq']){const sn=await fs.collection('crm_'+c).get();o[c]={};n[c]=sn.size;sn.docs.forEach(d=>o[c][d.id]=d.data())}const f='crm_respaldo_'+o.fecha.slice(0,10)+'.json';const b=new Blob([JSON.stringify(o)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f;document.body.appendChild(a);a.click();a.remove();m.textContent='Listo: '+f+' ('+n.vis+' visitas, '+n.opp+' oportunidades, '+n.eq+' equipos, '+n.cli+' fichas de cliente). Revisa tu carpeta Descargas.'}catch(e){m.textContent='Error: '+(e.message||e)}};
 $('#sdb').onclick=async()=>{const f=$('#sd').files[0];if(!f)return;try{const d=JSON.parse(await f.text());$('#sdm').textContent='Cargando…';const w=async(id,items)=>fs.collection('seed').doc(id).set({j:JSON.stringify(items)});
  for(let i=0;i<d.clientes.length;i+=100)await w('clientes_'+(i/100),d.clientes.slice(i,i+100));await w('vendedores',d.vendedores);await w('materiales',d.materiales);await cargarDatos();$('#sdm').textContent='Listo: '+CL.length+' clientes cargados.'}catch(e){$('#sdm').textContent='Error: '+(e.message||e)}};
 const sv=async m=>{await fs.collection('config').doc('perfiles').set({map:m});vAdm()};

async function entrar(u){
 USEREMAIL=(u.email||'').toLowerCase();UID=u.uid;UOWNER=USEREMAIL===String(window.ADMIN_EMAIL||'').toLowerCase();$('#out').hidden=false;
 let perfil='all';
 if(!UOWNER){try{const d=await fs.collection('config').doc('perfiles').get();perfil=((d.data()||{}).map||{})[USEREMAIL]}catch(e){}
  if(!perfil){$('#tabs').innerHTML='';$('#app').innerHTML='<div class="warn">Tu usuario aún no tiene un perfil asignado. Pide al administrador que lo asigne.</div>';return}}
 let ok=false;try{ok=await cargarDatos()}catch(e){warn('No se pudieron leer los datos: '+(e.message||e.code))}
 DB={collection:n=>fs.collection(n)};
 if(UOWNER){if(!TABS.some(t=>t[0]==='adm'))TABS.push(['adm','Administración']);ME=ls('crm_me')||'all'}
 else ME=perfil==='all'?'all':(perfil==='A'||perfil==='G')?'seg:'+perfil:perfil;
 ['cli','vis','opp','eq'].forEach(c=>sub(c,{cli:ST,vis:VIS,opp:OPP,eq:EQ}[c]));
 if(!ok){view=UOWNER?'adm':'panel';if(!UOWNER){$('#app').innerHTML='<div class="warn">Aún no se ha cargado la base de clientes. Avisa al administrador.</div>';return}}
 render()}
async function boot(){
 if(!window.FB_CFG||String(FB_CFG.apiKey).startsWith('PEGAR')){$('#app').innerHTML='<div class="warn">Falta configurar Firebase: edita el archivo firebase-config.js con los datos de tu proyecto (ver guía).</div>';return}
 firebase.initializeApp(FB_CFG);auth=firebase.auth();fs=firebase.firestore();try{await fs.enablePersistence({synchronizeTabs:true})}catch(e){}
 $('#out').onclick=()=>auth.signOut();
 auth.onAuthStateChanged(u=>{u?entrar(u):showLogin()})}
boot();
</script>
